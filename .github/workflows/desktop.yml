name: Windows desktop release

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Rust
        run: rustup update stable --no-self-update
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build signed Windows installer
        run: npm run desktop:build:release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Test native backup operations
        run: cargo test --release --manifest-path src-tauri/Cargo.toml
      - name: Prepare release artifacts
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "desktop-v$version") { throw 'Tag and application version differ' }
          npm run desktop:release -- --base-url "https://github.com/$env:GITHUB_REPOSITORY/releases/download/desktop-v$version/"
      - uses: actions/upload-artifact@v4
        with:
          name: mappingout-windows
          path: releases/*/*
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          gh release create $env:GITHUB_REF_NAME --verify-tag --draft --title "MappingOut Desktop $version" --notes-file docs/desktop-release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release' }
          $assets = (Get-ChildItem "releases/$version" -File).FullName
          gh release upload $env:GITHUB_REF_NAME @assets
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets' }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }
