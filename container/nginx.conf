# [INPUT]: 依赖生产 dist、Nginx MIME 表与 /tmp 临时目录。
# [OUTPUT]: 提供 8080 静态服务、/healthz 和按资源类型区分的缓存策略。
# [POS]: 容器 HTTP 边界；对应 public/_headers，缺失文件返回真实 404。
# [PROTOCOL]: Update this header on change, then check AGENTS.md
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    types {
        font/ttf ttf;
    }
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    map $uri $cache_control {
        default "public, max-age=0, must-revalidate";
        ~^/build/ "public, max-age=31536000, immutable";
        ~^/(index\.html|sw\.js)?$ "no-cache";
        /healthz "no-store";
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /srv/mappingout;
        index index.html;
        # 缓存头仅附于成功响应与 304，禁止缓存缺失的哈希文件。
        add_header Cache-Control $cache_control;
        add_header X-Content-Type-Options nosniff always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = / {
            try_files /index.html =404;
        }

        location / {
            try_files $uri =404;
        }
    }
}
